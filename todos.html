            { game: "QUINIELA MISIONERA", name: "MATUTINA", head: c.matutina || "----", fecha: resQuiniela.fecha || "" },
            { game: "QUINIELA MISIONERA", name: "MATUTINA PLUS", head: c.matPlus || "----", fecha: resQuiniela.fecha || "" },
            { game: "QUINIELA MISIONERA", name: "VESPERTINA", head: c.vespertina || "----", fecha: resQuiniela.fecha || "" },
            { game: "QUINIELA MISIONERA", name: "NOCTURNA", head: c.nocturna || "----", fecha: resQuiniela.fecha || "" },
            { game: "QUINIELA MISIONERA", name: "NOCTURNA PLUS", head: c.noctPlus || "----", fecha: resQuiniela.fecha || "" }
          ];
        }
        setDebug("Loterías: Sincronizadas");
      } catch (e) {
        console.warn("Error cargando loterías", e);
        setDebug("Loterías: Error de red", true);
      }
    }

    loadLotteryData();
    setInterval(loadLotteryData, 5 * 60 * 1000); // Reducido a 5 min para no saturar

    const q = query(collection(db, "mensajes"), where("estado", "==", "aprobado"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
      const rawList = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        data.id = doc.id;
        rawList.push(data);
      });

      chatMessages = rawList.filter(msg => {
        if (!msg.timestamp) return true;
        const msgTime = msg.timestamp.toDate ? msg.timestamp.toDate().getTime() : Date.now();
        return (Date.now() - msgTime) <= 24 * 60 * 60 * 1000;
      });

      if (!isMasterLoopRunning) {
        setDebug("Chat: Conectado a Firebase");
        startMasterBroadcastLoop();
      }
    });

    // ---------------------------------------------------------
    // HORÓSCOPO CON CACHÉ LOCAL (Inmune a bloqueos de API)
    // ---------------------------------------------------------
    async function loadHoroscopeAPIs() {
      try {
        const fetched = [];
        const cacheBuster = `&_t=${Date.now()}`;
        let allSuccess = true;

        for (const sign of ZODIAC_CONFIG) {
          let textLoaded = null;
          try {
            const url = `https://api.jotform.com/website-widgets/templates/019f365ed74870008e184f2271ab1b90f656/execute-action?action=getHoroscopeData&period=daily&sign=${sign.apiKey}&language=es&widgetID=01a120be41b070008003137f1833c7dc8d78${cacheBuster}`;
            const res = await fetch(url, { cache: "no-store" });
            if (res.ok) {
              const json = await res.json();
              if (json && json.content && json.content.horoscope) {
                textLoaded = json.content.horoscope.trim();
              } else {
                allSuccess = false;
              }
            } else {
              allSuccess = false;
            }
          } catch (e) {
            allSuccess = false;
          }
          
          // Si falló la API, recuperar de caché local
          if (!textLoaded) {
            const cached = localStorage.getItem(`horoscope_${sign.key}`);
            textLoaded = cached ? JSON.parse(cached).text : sign.defaultText;
          } else {
            // Si tuvo éxito, guardar en caché local para el futuro
            localStorage.setItem(`horoscope_${sign.key}`, JSON.stringify({
              text: textLoaded,
              timestamp: Date.now()
            }));
          }
          fetched.push({ ...sign, text: textLoaded });
        }
        
        horoscopeList = fetched;
        if (allSuccess) {
          setDebug("Horóscopo: Actualizado desde API");
        } else {
          setDebug("Horóscopo: Usando datos en caché (API limitada)", true);
        }
      } catch (e) {
        console.warn("Error cargando horóscopo", e);
      }
    }

    loadHoroscopeAPIs();
    // CAMBIO CLAVE: Los horóscopos solo cambian 1 vez al día. Pedirlos cada 10 min causa bloqueos.
    // Lo cambiamos a cada 6 horas (21600000 ms).
    setInterval(loadHoroscopeAPIs, 6 * 60 * 60 * 1000);

    function startMasterBroadcastLoop() {
      if (isMasterLoopRunning) return;
      isMasterLoopRunning = true;
      runNextCard();
    }

    function runNextCard() {
      resetWatchdog();
      if (activeMarqueeFrame) {
        cancelAnimationFrame(activeMarqueeFrame);
        activeMarqueeFrame = null;
      }

      masterSection = (masterSection + 1) % 6;

      switch(masterSection) {
        case 0: if (chatMessages.length > 0) { renderChatCard(); return; }
        case 1: if (quiniList.length > 0) { renderQuiniCard(); return; }
        case 2: if (brincoList.length > 0) { renderBrincoCard(); return; }
        case 3: if (quinielaList.length > 0) { renderQuinielaCard(); return; }
        case 4: if (horoscopeList.length > 0) { renderHoroscopeCard(); return; }
        case 5: renderPromoQRCard(); return;
      }
      renderPromoQRCard();
    }

    function renderChatCard() {
      if (chatMessages.length === 0) { runNextCard(); return; }
      if (chatIndex >= chatMessages.length) chatIndex = 0;
      const msg = chatMessages[chatIndex++];

      const lugarHtml = (msg.lugar && msg.lugar.trim() !== '') ? `<div class="chat-location-tag">📍 ${msg.lugar.trim()}</div>` : '';
      const textLength = (msg.msj || '').length;
      let dynamicFontSize = '32px';
      if (textLength > 120) dynamicFontSize = '22px';
      else if (textLength > 90) dynamicFontSize = '25px';
      else if (textLength > 65) dynamicFontSize = '28px';

      cardDynamicContent.innerHTML = `
        <div class="chat-card-wrapper">
          <div class="chat-top-bar">
            <div class="chat-badge-pill"><span class="chat-badge-dot"></span> OYENTE AL AIRE</div>
            <div class="chat-author-tag">${msg.nombre || 'ANÓNIMO'}</div>
            ${lugarHtml}
          </div>
          <div class="chat-main-body" style="font-size: ${dynamicFontSize};" id="chatBodyContainer">
            <span id="chatTextSpan" style="display: inline-block;">"${msg.msj || ''}"</span>
          </div>
        </div>
      `;

      setTimeout(() => {
        upperCard.classList.remove('hidden-card');
        const container = document.getElementById('chatBodyContainer');
        const textSpan = document.getElementById('chatTextSpan');

        if (container && textSpan) {
          const overflowDistance = textSpan.offsetWidth - container.offsetWidth + 60;
          if (overflowDistance > 0) {
            const speedPxPerSec = 70;
            const scrollDurationMs = (overflowDistance / speedPxPerSec) * 1000;
            let startTime = null;

            function animateStep(timestamp) {
              if (!startTime) startTime = timestamp;
              const elapsed = timestamp - startTime;
              if (elapsed < 3500) {
                textSpan.style.transform = 'translateX(0px)';
              } else if (elapsed < (3500 + scrollDurationMs)) {
                const progress = (elapsed - 3500) / scrollDurationMs;
                textSpan.style.transform = `translateX(-${progress * overflowDistance}px)`;
              } else {
                textSpan.style.transform = `translateX(-${overflowDistance}px)`;
              }

              if (elapsed < (3500 + scrollDurationMs + 3000)) {
                activeMarqueeFrame = requestAnimationFrame(animateStep);
              } else {
                upperCard.classList.add('hidden-card');
                setTimeout(runNextCard, 1000);
              }
            }
            activeMarqueeFrame = requestAnimationFrame(animateStep);
          } else {
            setTimeout(() => {
              upperCard.classList.add('hidden-card');
              setTimeout(runNextCard, 1000);
            }, 35000);
          }
        }
      }, 100);
    }

    function renderQuiniCard() {
      if (quiniIndex >= quiniList.length) quiniIndex = 0;
      const lot = quiniList[quiniIndex++];
      let ballsHtml = '';
      (lot.numbers || ["04","05","32","39","40","44"]).forEach(num => { ballsHtml += `<div class="tv-ball-item">${num}</div>`; });

      cardDynamicContent.innerHTML = `
        <div class="broadcast-tv-card">
          <div class="card-left-badge badge-quini">
            <div class="game-title">${lot.game}</div>
            <div class="game-date">${lot.info} • ${lot.fecha}</div>
          </div>
          <div class="card-center-title">${lot.name}</div>
          <div class="card-right-content"><div class="tv-balls-group">${ballsHtml}</div></div>
        </div>
      `;
      setTimeout(() => upperCard.classList.remove('hidden-card'), 100);
      setTimeout(() => { upperCard.classList.add('hidden-card'); setTimeout(runNextCard, 1000); }, 25000);
    }

    function renderBrincoCard() {
      if (brincoIndex >= brincoList.length) brincoIndex = 0;
      const lot = brincoList[brincoIndex++];
      let ballsHtml = '';
      (lot.numbers || ["07","22","26","33","34","39"]).forEach(num => { ballsHtml += `<div class="tv-ball-item">${num}</div>`; });

      cardDynamicContent.innerHTML = `
        <div class="broadcast-tv-card">
          <div class="card-left-badge badge-quini">
            <div class="game-title">${lot.game}</div>
            <div class="game-date">${lot.info} • ${lot.fecha}</div>
          </div>
          <div class="card-center-title">${lot.name}</div>
          <div class="card-right-content"><div class="tv-balls-group">${ballsHtml}</div></div>
        </div>
      `;
      setTimeout(() => upperCard.classList.remove('hidden-card'), 100);
      setTimeout(() => { upperCard.classList.add('hidden-card'); setTimeout(runNextCard, 1000); }, 25000);
    }

    function renderQuinielaCard() {
      if (quinielaIndex >= quinielaList.length) quinielaIndex = 0;
      const qm = quinielaList[quinielaIndex++];

      cardDynamicContent.innerHTML = `
        <div class="broadcast-tv-card">
          <div class="card-left-badge badge-quiniela">
            <div class="game-title">${qm.game}</div>
            <div class="game-date">FECHA: ${qm.fecha}</div>
          </div>
          <div class="card-center-title" style="color: #047857;">1° A LA CABEZA DE LA ${qm.name}</div>
          <div class="card-right-content">
            <div class="quiniela-head-tv-box"><div class="num">${qm.head}</div></div>
          </div>
        </div>
      `;
      setTimeout(() => upperCard.classList.remove('hidden-card'), 100);
      setTimeout(() => { upperCard.classList.add('hidden-card'); setTimeout(runNextCard, 1000); }, 25000);
    }

    function renderHoroscopeCard() {
      if (horoscopeIndex >= horoscopeList.length) horoscopeIndex = 0;
      const item = horoscopeList[horoscopeIndex++];

      cardDynamicContent.innerHTML = `
        <div class="horoscope-tv-card">
          <div class="horoscope-left-badge">
            <div class="horoscope-icon-box">${ZODIAC_SVGS[item.key] || ZODIAC_SVGS['aries']}</div>
            <div class="horoscope-meta">
              <div class="sign-title">${item.name}</div>
              <div class="sign-sub">HORÓSCOPO DEL DÍA</div>
              <div class="sign-dates">${item.dates}</div>
            </div>
          </div>
          <div class="horoscope-prediction-body" id="horoscopeWrapper">
            <div class="horoscope-scroll-text" id="horoscopeText">${item.text || item.defaultText}</div>
          </div>
        </div>
      `;

      setTimeout(() => {
        upperCard.classList.remove('hidden-card');
        const wrapper = document.getElementById('horoscopeWrapper');
        const textElem = document.getElementById('horoscopeText');

        if (wrapper && textElem) {
          const overflowDistance = textElem.offsetWidth - wrapper.offsetWidth + 90;
          if (overflowDistance > 0) {
            const speedPxPerSec = 75; 
            const scrollDurationMs = (overflowDistance / speedPxPerSec) * 1000;
            let startTime = null;

            function animateStep(timestamp) {
              if (!startTime) startTime = timestamp;
              const elapsed = timestamp - startTime;
              if (elapsed < 3500) {
                textElem.style.transform = 'translateX(0px)';
              } else if (elapsed < (3500 + scrollDurationMs)) {
                const progress = (elapsed - 3500) / scrollDurationMs;
                textElem.style.transform = `translateX(-${progress * overflowDistance}px)`;
              } else {
                textElem.style.transform = `translateX(-${overflowDistance}px)`;
              }

              if (elapsed < (3500 + scrollDurationMs + 3000)) {
                activeMarqueeFrame = requestAnimationFrame(animateStep);
              } else {
                upperCard.classList.add('hidden-card');
                setTimeout(runNextCard, 1000);
              }
            }
            activeMarqueeFrame = requestAnimationFrame(animateStep);
          } else {
            textElem.style.transform = 'translateX(0px)';
            setTimeout(() => { upperCard.classList.add('hidden-card'); setTimeout(runNextCard, 1000); }, 12000);
          }
        }
      }, 100);
    }

    function renderPromoQRCard() {
      if (promoIndex >= PROMO_CONFIG.length) promoIndex = 0;
      const promo = PROMO_CONFIG[promoIndex++];
      const qrSrc = preloadedQrImages[promo.destinationUrl] ? preloadedQrImages[promo.destinationUrl].src : `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(promo.destinationUrl)}`;

      cardDynamicContent.innerHTML = `
        <div class="broadcast-tv-card">
          <div class="card-left-badge badge-promo">
            <div class="game-title">${promo.badgeTitle}</div>
            <div class="game-date">${promo.badgeSub}</div>
          </div>
          <div class="card-center-title">${promo.mainText}</div>
          <div class="card-right-content">
            <div class="qr-tv-container">
              <span class="qr-tv-header-tag">ESCANEAR QR</span>
              <div class="qr-tv-box"><img src="${qrSrc}" alt="QR Code" /></div>
            </div>
          </div>
        </div>
      `;
      setTimeout(() => upperCard.classList.remove('hidden-card'), 100);
      setTimeout(() => { upperCard.classList.add('hidden-card'); setTimeout(runNextCard, 1000); }, 60000);
    }

    startMasterBroadcastLoop();
  </script>

  <script>
    let rssAnimationId = null;

    // ---------------------------------------------------------
    // NOTICIAS CON CACHÉ LOCAL (Inmune a bloqueos de API)
    // ---------------------------------------------------------
    async function fetchJotformNews() {
      let newsList = [];
      let useCache = false;

      try {
        setDebug("Sincronizando noticias...");
        const cacheBuster = `&_t=${Date.now()}`;
        const apiUrl = `https://api.jotform.com/website-widgets/templates/019f3bae37487000889dd04d159b98b17f3a/execute-action?action=refreshSocialFeed&widgetID=01a13e9789a87000805d60e413b14e37d5b0${cacheBuster}`;
        const res = await fetch(apiUrl, { cache: "no-store" });
        
        if (!res.ok) {
          if (res.status === 429) {
            setDebug("Noticias: API bloqueada por exceso de solicitudes. Usando caché.", true);
          }
          throw new Error("HTTP " + res.status);
        }
        
        const data = await res.json();

        if (data && data.content && data.content.feedData && data.content.feedData.sources) {
          data.content.feedData.sources.forEach(sourceObj => {
            if (sourceObj.success && sourceObj.posts && sourceObj.posts.length > 0) {
              let sourceTag = "NOTICIAS";
              const rawSource = (sourceObj.source || "").toLowerCase();
              const rawLabel = (sourceObj.sourceLabel || "").toLowerCase();

              if (rawSource.includes("clarin") || rawLabel.includes("clarin")) sourceTag = "CLARÍN";
              else if (rawSource.includes("lanoticia") || rawLabel.includes("noticia")) sourceTag = "LA NOTICIA";
              else if (rawSource.includes("infobae") || rawLabel.includes("infobae")) sourceTag = "INFOBAE";
              else if (rawSource.includes("perfil") || rawLabel.includes("perfil")) sourceTag = "PERFIL";
              else if (rawSource.includes("ole") || rawLabel.includes("ole")) sourceTag = "OLÉ";
              else sourceTag = sourceObj.sourceLabel ? sourceObj.sourceLabel.toUpperCase() : "ARGENTINA";

              sourceObj.posts.slice(0, 5).forEach(post => {
                if (post.title) newsList.push({ text: post.title.trim(), source: sourceTag });
              });
            }
          });
          
          if (newsList.length > 0) {
            // Guardar en caché local para usar si la API falla en el futuro
            localStorage.setItem('djtv_news_cache', JSON.stringify(newsList));
            setDebug(`Noticias: ${newsList.length} artículos cargados`);
          }
        } else {
          throw new Error("Formato de datos inesperado");
        }
      } catch (e) {
        console.warn("Fallo en API de Noticias, usando caché o fallback.", e);
        
        // INTENTAR RECUPERAR DE CACHÉ LOCAL
        const cachedNews = localStorage.getItem('djtv_news_cache');
        if (cachedNews) {
          newsList = JSON.parse(cachedNews);
          setDebug("Noticias: Usando caché local (API temporalmente no disponible)", true);
          useCache = true;
        } else {
          // Fallback extremo si no hay caché
          setDebug("Noticias: Usando fallback local", true);
          newsList = [
            { text: "Bienvenidos a DJ TV Estación Mix - Transmitiendo música y entretenimiento las 24 horas en calidad HD.", source: "DJ TV" },
            { text: "Seguinos en nuestras redes sociales oficiales y participá de la programación diaria.", source: "REDES" },
            { text: "Disfrutá de la mejor selección de música retro, pop, reggaeton, electro y rock nacional.", source: "MÚSICA" },
            { text: "Envianos tus saludos y dedicatorias a través del chat interactivo en pantalla.", source: "CHAT" },
            { text: "Transmitiendo en vivo desde Posadas, Misiones, para todo el país y el mundo.", source: "ON AIR" }
          ];
        }
      }

      if (newsList.length === 0) {
         newsList = [{ text: "Bienvenidos a DJ TV Estación Mix - Transmitiendo música y entretenimiento las 24 horas.", source: "DJ TV" }];
      } else if (!useCache) {
        // Solo mezclamos si son datos nuevos, para que el caché no salte loco al recargar
        newsList.sort(() => Math.random() - 0.5);
      }
      startTickerAnimation(newsList);
    }

    function startTickerAnimation(newsList) {
      const container = document.getElementById('ticker-text');
      if (!container) return;
      if (rssAnimationId) {
        cancelAnimationFrame(rssAnimationId);
        rssAnimationId = null;
      }

      let htmlContent = '';
      const newsToRender = [...newsList, ...newsList]; 
      newsToRender.forEach(item => {
        htmlContent += `<div class="news-item"><span class="news-source">${item.source}</span> ${item.text}<span class="news-separator">•</span></div>`;
      });

      container.innerHTML = htmlContent;
      container.style.transform = 'translateX(0px)';
      
      let posX = 0;
      const speed = 1.2; 
      
      function step() {
        posX -= speed;
        const contentWidth = container.scrollWidth / 2;
        if (contentWidth > 0 && Math.abs(posX) >= contentWidth) posX = 0;
        container.style.transform = `translateX(${posX}px)`;
        rssAnimationId = requestAnimationFrame(step);
      }
      setTimeout(step, 100);
    }

    fetchJotformNews();
    // CAMBIO CLAVE: De 15 min a 30 min. Reduce las solicitudes a la mitad, evitando el bloqueo por "Rate Limit".
    setInterval(fetchJotformNews, 30 * 60 * 1000);
  </script>
</body>
