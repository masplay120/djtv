<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0 !important; padding: 0 !important;
      background: transparent !important; overflow: hidden; font-family: 'Montserrat', sans-serif;
      width: 1920px; height: 1080px; user-select: none;
    }
    .tv-master-lower-third { position: absolute; bottom: 0; left: 0; width: 1920px; height: 1080px; z-index: 9999; pointer-events: none; }
    #debug-panel {
      position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.85); color: #00ff66;
      padding: 8px 12px; font-family: 'Orbitron', monospace; font-size: 11px; z-index: 10000;
      border-radius: 6px; border: 1px solid #333; pointer-events: none;
    }
    .upper-card {
      position: absolute; bottom: 75px; left: 60px; width: 1800px; height: 135px;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; align-items: center; filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.85));
    }
    .upper-card.hidden-card { opacity: 0; transform: translateY(30px); pointer-events: none; }
    .chat-card-wrapper { display: flex; flex-direction: column; width: 100%; }
    .chat-top-bar { display: flex; align-items: center; gap: 0px; height: 48px; }
    .chat-badge-pill {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); color: #ffffff;
      font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; padding: 8px 24px;
      border-radius: 14px 14px 0 0; display: flex; align-items: center; gap: 10px; text-transform: uppercase;
    }
    .chat-badge-dot { width: 10px; height: 10px; background-color: #00ff66; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .chat-author-tag { background: #0f172a; color: #f472b6; font-weight: 900; font-size: 22px; padding: 6px 20px; border-radius: 0 12px 0 0; text-transform: uppercase; border-top: 2px solid #ec4899; border-right: 2px solid #ec4899; }
    .chat-location-tag { background: #1e293b; color: #38bdf8; font-weight: 800; font-size: 20px; padding: 6px 18px; border-radius: 0 12px 0 0; margin-left: 2px; border-top: 2px solid #38bdf8; border-right: 2px solid #38bdf8; }
    .chat-main-body {
      background: #ffffff; color: #0f172a; font-weight: 900; font-style: italic; padding: 10px 28px;
      border-radius: 0 16px 16px 16px; border-left: 10px solid #ec4899; white-space: nowrap; overflow: hidden; width: 100%;
    }
    .broadcast-tv-card {
      display: flex; align-items: center; justify-content: space-between; width: 100%; height: 110px;
      background: #ffffff; border-radius: 20px; overflow: hidden; border: 3px solid #1e293b;
    }
    .card-left-badge { height: 100%; padding: 0 32px; display: flex; flex-direction: column; justify-content: center; color: #ffffff; min-width: 400px; }
    .badge-quini { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); }
    .badge-quiniela { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
    .badge-promo { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
    .card-left-badge .game-title { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; text-transform: uppercase; }
    .card-left-badge .game-date { font-size: 18px; font-weight: 800; color: #f8fafc; margin-top: 4px; text-transform: uppercase; }
    .card-center-title { flex: 1; padding: 0 35px; font-size: 32px; font-weight: 900; color: #0f172a; text-transform: uppercase; font-style: italic; }
    .card-right-content { padding-right: 35px; display: flex; align-items: center; }
    .tv-balls-group { display: flex; gap: 22px; }
    .tv-ball-item {
      width: 70px; height: 70px; background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
      color: #0f172a; font-weight: 900; font-size: 30px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; border: 2px solid #94a3b8;
    }
    .quiniela-head-tv-box {
      background: linear-gradient(135deg, #047857 0%, #064e3b 100%); color: #ffffff;
      padding: 10px 35px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    }
    .quiniela-head-tv-box .num { font-family: 'Orbitron', sans-serif; font-size: 52px; font-weight: 900; letter-spacing: 4px; }
    .qr-tv-container { display: flex; flex-direction: column; align-items: center; background: #0f172a; padding: 4px 8px 6px 8px; border-radius: 14px; border: 2px solid #38bdf8; }
    .qr-tv-header-tag { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 900; color: #ffffff; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); padding: 2px 14px; border-radius: 6px; text-transform: uppercase; margin-bottom: 4px; }
    .qr-tv-box { background: #ffffff; padding: 4px; border-radius: 10px; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }
    .qr-tv-box img { width: 100%; height: 100%; object-fit: contain; }
    .horoscope-tv-card { display: flex; align-items: center; width: 100%; height: 110px; background: #ffffff; border-radius: 20px; overflow: hidden; border: 3px solid #f59e0b; }
    .horoscope-left-badge { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); height: 100%; padding: 0 28px; display: flex; align-items: center; gap: 16px; color: #ffffff; min-width: 400px; }
    .horoscope-icon-box { width: 58px; height: 58px; background: #ffffff; color: #d97706; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .horoscope-icon-box svg { width: 38px; height: 38px; }
    .horoscope-meta { display: flex; flex-direction: column; }
    .horoscope-meta .sign-title { font-family: 'Oswald', sans-serif; font-size: 34px; font-weight: 800; line-height: 1; text-transform: uppercase; }
    .horoscope-meta .sign-sub { font-size: 13px; font-weight: 900; color: #fef3c7; letter-spacing: 1.5px; margin-top: 2px; text-transform: uppercase; }
    .horoscope-meta .sign-dates { font-size: 13px; font-weight: 800; color: #fde68a; margin-top: 1px; }
    .horoscope-prediction-body { flex: 1; padding: 0 30px; overflow: hidden; position: relative; display: flex; align-items: center; height: 100%; }
    .horoscope-scroll-text { font-size: 30px; font-weight: 800; color: #0f172a; white-space: nowrap; position: absolute; left: 30px; will-change: transform; padding-right: 80px; }
    .news-row { position: absolute; bottom: 0; left: 0; width: 1920px; height: 60px; background: rgba(8, 8, 14, 0.98); border-top: 2px solid #2563eb; display: flex; align-items: center; }
    .news-badge { flex-shrink: 0; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); height: 100%; padding: 0 24px; display: flex; align-items: center; color: #ffffff; font-weight: 900; font-size: 24px; letter-spacing: 2px; white-space: nowrap; text-transform: uppercase; font-family: 'Orbitron', sans-serif; z-index: 30; }
    .ticker-wrapper { flex: 1 1 0%; min-width: 0; height: 100%; overflow: hidden; position: relative; display: flex; align-items: center; }
    .ticker-content { display: flex; align-items: center; white-space: nowrap; position: absolute; will-change: transform; left: 0; }
    .news-item { display: inline-flex; align-items: center; font-size: 22px; font-weight: 700; color: #ffffff; padding-right: 40px; }
    .news-source { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); color: #38bdf8; font-weight: 900; font-size: 14px; padding: 3px 8px; border-radius: 4px; margin-right: 12px; text-transform: uppercase; }
    .news-separator { color: #2563eb; margin-left: 25px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="debug-panel">🟢 Sistema: Iniciando...</div>

  <script type="module">

    // ⚠️ REEMPLAZA ESTO CON LA URL REAL DE TU CLOUDFLARE WORKER ⚠️

        debugPanel.style.color = isError ? '#ff4444' : '#00ff66';
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyARhC07Q4CvEqB1JytYK_AkY2_HQw4ToSY",
      authDomain: "dj-tv-estacion-mix.firebaseapp.com",
      projectId: "dj-tv-estacion-mix",

      messagingSenderId: "955348774578",
      appId: "1:955348774578:web:221c8f8edac25a53e023ab"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // (Se mantienen tus constantes ZODIAC_SVGS, ZODIAC_CONFIG, PROMO_CONFIG exactamente igual que antes)
    const ZODIAC_SVGS = { aries: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21V9"/><path d="M12 9a5 5 0 0 0-5-5c-2.8 0-5 2.2-5 5 0 2.5 2 4.5 4.5 4.5"/><path d="M12 9a5 5 0 0 1 5-5c2.8 0 5 2.2 5 5 0 2.5-2 4.5-4.5 4.5"/></svg>`, taurus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="14" r="6"/><path d="M6 4a6 6 0 0 0 12 0"/></svg>`, gemini: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4a16 16 0 0 0 16 0"/><path d="M4 20a16 16 0 0 1 16 0"/><path d="M8 4v16"/><path d="M16 4v16"/></svg>`, cancer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="6" cy="10" r="3"/><circle cx="18" cy="14" r="3"/><path d="M9 10a7 7 0 0 0 11-4"/><path d="M15 14a7 7 0 0 0-11 4"/></svg>`, leo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="7" cy="17" r="3"/><path d="M10 17c0-4 3-7 7-7a4 4 0 0 0 0-8c-2.5 0-4.5 2-4.5 4.5 0 3.5 2 5.5 2 8.5 0 2.5-2 4.5-4.5 4"/></svg>`, virgo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4v10a3 3 0 0 0 6 0V4"/><path d="M10 4v10a3 3 0 0 0 6 0V4"/><path d="M16 4v10a3 3 0 0 0 3 3h1"/><path d="M18 13a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>`, libra: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20h16"/><path d="M4 16h16"/><path d="M8 16a4 4 0 0 1 8 0"/><path d="M12 5v7"/><path d="M9 8h6"/></svg>`, scorpio: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4v10a3 3 0 0 0 6 0V4"/><path d="M10 4v10a3 3 0 0 0 6 0V4"/><path d="M16 4v11a2 2 0 0 0 2 2h3"/><path d="m19 15 3 2-3 2"/></svg>`, sagittarius: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 5 5 19"/><path d="M14 5h5v5"/><path d="M9 9 5 5"/><path d="M19 19l-4-4"/></svg>`, capricorn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4l5 13a2 2 0 0 0 4 0l3-8"/><circle cx="18" cy="15" r="3"/><path d="M18 18c0 2-1.5 3.5-3.5 3.5S11 20 11 18"/></svg>`, aquarius: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3-3 4 4 4-4 4 4 3-3"/><path d="m3 16 3-3 4 4 4-4 4 4 3-3"/></svg>`, pisces: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12h16"/><path d="M6 4a16 16 0 0 1 0 16"/><path d="M18 4a16 16 0 0 0 0 16"/></svg>` };
    const ZODIAC_CONFIG = [ { key: 'aries', apiKey: 'aries', name: 'Aries', dates: '21 MAR - 19 ABR', defaultText: 'Momentos de gran energía creativa.' }, { key: 'taurus', apiKey: 'Taurus', name: 'Tauro', dates: '20 ABR - 20 MAY', defaultText: 'Estabilidad y buenas oportunidades financieras.' }, { key: 'gemini', apiKey: 'Gemini', name: 'Géminis', dates: '21 MAY - 20 JUN', defaultText: 'La comunicación y las relaciones sociales están a tu favor.' }, { key: 'cancer', apiKey: 'Cancer', name: 'Cáncer', dates: '21 JUN - 22 JUL', defaultText: 'Escuchá tu intuición para tomar decisiones importantes.' }, { key: 'leo', apiKey: 'leo', name: 'Leo', dates: '23 JUL - 22 AGO', defaultText: 'Tu liderazgo natural destaca hoy con fuerza.' }, { key: 'virgo', apiKey: 'Virgo', name: 'Virgo', dates: '23 AGO - 22 SEP', defaultText: 'Organización y disciplina clave.' }, { key: 'libra', apiKey: 'Libra', name: 'Libra', dates: '23 SEP - 22 OCT', defaultText: 'Búsqueda de equilibrio e inspiración.' }, { key: 'scorpio', apiKey: 'Scorpio', name: 'Escorpio', dates: '23 OCT - 21 NOV', defaultText: 'Determinación y pasión en todo lo que emprendas.' }, { key: 'sagittarius', apiKey: 'Sagittarius', name: 'Sagitario', dates: '22 NOV - 21 DIC', defaultText: 'Aventuras y nuevas experiencias.' }, { key: 'capricorn', apiKey: 'Capricorn', name: 'Capricornio', dates: '22 DIC - 19 ENE', defaultText: 'Perseverancia y enfoque profesional.' }, { key: 'aquarius', apiKey: 'Aquarius', name: 'Acuario', dates: '20 ENE - 18 FEB', defaultText: 'Ideas innovadoras y originales.' }, { key: 'pisces', apiKey: 'Pisces', name: 'Piscis', dates: '19 FEB - 20 MAR', defaultText: 'Sensibilidad y empatía conectando positivamente.' } ];
    const PROMO_CONFIG = [ { badgeTitle: "SUMATE AL CHAT", badgeSub: "COMUNIDAD TV", mainText: "Escanear el QR para enviarnos tus mensajes", destinationUrl: "https://masplay120.github.io/djtv" }, { badgeTitle: "COLABORÁ CON EL CANAL", badgeSub: "DONACIONES MP", mainText: "Apoyá al canal con tu colaboración voluntaria", destinationUrl: "https://link.mercadopago.com.ar/masplay" } ];

    const preloadedQrImages = {};
    PROMO_CONFIG.forEach(p => { const img = new Image(); img.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(p.destinationUrl)}`; preloadedQrImages[p.destinationUrl] = img; });

    let chatMessages = [], quiniList = [], brincoList = [], quinielaList = [], horoscopeList = [...ZODIAC_CONFIG];
    let chatIndex = 0, quiniIndex = 0, brincoIndex = 0, quinielaIndex = 0, horoscopeIndex = 0, promoIndex = 0;
    let masterSection = 0, isMasterLoopRunning = false, activeMarqueeFrame = null;

    const upperCard = document.getElementById('upperCard');
    const cardDynamicContent = document.getElementById('cardDynamicContent');

    // ... (Aquí van las funciones loadLotteryData, renderChatCard, renderQuiniCard, renderBrincoCard, renderQuinielaCard, renderHoroscopeCard, renderPromoQRCard, startMasterBroadcastLoop, runNextCard EXACTAMENTE IGUAL QUE EN TU CÓDIGO ORIGINAL) ...
    // Para ahorrar espacio, asumo que copiarás esas funciones de tu código anterior, ya que funcionan bien. 
    // Solo estamos cambiando la lógica de noticias y horóscopo abajo.

    // ---------------------------------------------------------
    // HORÓSCOPO A TRAVÉS DEL WORKER (A PRUEBA DE BLOQUEOS)
    // ---------------------------------------------------------
    async function loadHoroscopeAPIs() {
      try {
        const fetched = [];
        let allSuccess = true;

        for (const sign of ZODIAC_CONFIG) {
          let textLoaded = null;
          try {
            // PETICIÓN A TU WORKER, NO A JOTFORM DIRECTAMENTE
            const res = await fetch(`${WORKER_URL}?type=horoscope&sign=${sign.apiKey}`, { cache: "no-store" });
            if (res.ok) {
              const json = await res.json();
              if (json && json.content && json.content.horoscope) {
                textLoaded = json.content.horoscope.trim();
              } else { allSuccess = false; }
            } else { allSuccess = false; }
          } catch (e) { allSuccess = false; }
          
          if (!textLoaded) {
            const cached = localStorage.getItem(`horoscope_${sign.key}`);
            textLoaded = cached ? JSON.parse(cached).text : sign.defaultText;
          } else {
            localStorage.setItem(`horoscope_${sign.key}`, JSON.stringify({ text: textLoaded, timestamp: Date.now() }));
          }
          fetched.push({ ...sign, text: textLoaded });
        }
        horoscopeList = fetched;
        setDebug(allSuccess ? "Horóscopo: Actualizado (vía Worker)" : "Horóscopo: Usando caché local", !allSuccess);
      } catch (e) { console.warn("Error horóscopo", e); }
    }

    loadHoroscopeAPIs();
    setInterval(loadHoroscopeAPIs, 6 * 60 * 60 * 1000); // 6 horas

    // ---------------------------------------------------------
    // NOTICIAS A TRAVÉS DEL WORKER (A PRUEBA DE BLOQUEOS)
    // ---------------------------------------------------------
    async function fetchJotformNews() {
      let newsList = [];
      let useCache = false;

      try {
        setDebug("Sincronizando noticias (vía Worker)...");
        // PETICIÓN A TU WORKER, NO A JOTFORM DIRECTAMENTE
        const res = await fetch(`${WORKER_URL}?type=news`, { cache: "no-store" });
        
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data && data.content && data.content.feedData && data.content.feedData.sources) {
          data.content.feedData.sources.forEach(sourceObj => {
            if (sourceObj.success && sourceObj.posts && sourceObj.posts.length > 0) {
              let sourceTag = "NOTICIAS";
              const rawSource = (sourceObj.source || "").toLowerCase();
              const rawLabel = (sourceObj.sourceLabel || "").toLowerCase();
              if (rawSource.includes("clarin") || rawLabel.includes("clarin")) sourceTag = "CLARÍN";
              else if (rawSource.includes("lanoticia") || rawLabel.includes("noticia")) sourceTag = "LA NOTICIA";
              else if (rawSource.includes("infobae") || rawLabel.includes("infobae")) sourceTag = "INFOBAE";
              else sourceTag = sourceObj.sourceLabel ? sourceObj.sourceLabel.toUpperCase() : "ARGENTINA";

              sourceObj.posts.slice(0, 5).forEach(post => {
                if (post.title) newsList.push({ text: post.title.trim(), source: sourceTag });
              });
            }
          });
          
          if (newsList.length > 0) {
            localStorage.setItem('djtv_news_cache', JSON.stringify(newsList));
            setDebug(`Noticias: ${newsList.length} artículos cargados`);
          }
        } else { throw new Error("Formato inesperado"); }
      } catch (e) {
        console.warn("Fallo Worker/Noticias, usando caché.", e);
        const cachedNews = localStorage.getItem('djtv_news_cache');
        if (cachedNews) {
          newsList = JSON.parse(cachedNews);
          setDebug("Noticias: Usando caché local (Worker offline)", true);
          useCache = true;
        } else {
          setDebug("Noticias: Usando fallback local", true);
          newsList = [ { text: "Bienvenidos a DJ TV Estación Mix - Transmitiendo música y entretenimiento las 24 horas.", source: "DJ TV" }, { text: "Seguinos en nuestras redes sociales oficiales.", source: "REDES" } ];
        }
      }

      if (newsList.length === 0) newsList = [{ text: "Bienvenidos a DJ TV Estación Mix.", source: "DJ TV" }];
      else if (!useCache) newsList.sort(() => Math.random() - 0.5);
      
      startTickerAnimation(newsList);
    }

    function startTickerAnimation(newsList) {
      const container = document.getElementById('ticker-text');
      if (!container) return;
      if (window.rssAnimationId) cancelAnimationFrame(window.rssAnimationId);

      let htmlContent = '';
      [...newsList, ...newsList].forEach(item => {
        htmlContent += `<div class="news-item"><span class="news-source">${item.source}</span> ${item.text}<span class="news-separator">•</span></div>`;
      });
      container.innerHTML = htmlContent;
      container.style.transform = 'translateX(0px)';
      
      let posX = 0;
      function step() {
        posX -= 1.2;
        const contentWidth = container.scrollWidth / 2;
        if (contentWidth > 0 && Math.abs(posX) >= contentWidth) posX = 0;
        container.style.transform = `translateX(${posX}px)`;
        window.rssAnimationId = requestAnimationFrame(step);
      }
      setTimeout(step, 100);
    }

    fetchJotformNews();
    setInterval(fetchJotformNews, 30 * 60 * 1000); // 30 minutos
  </script>
