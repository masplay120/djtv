<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TV - OBS Lower Third</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
        }

        /* Contenedor adaptado a la escala de OBS */
        #obsOverlay {
            position: fixed;
            bottom: 40px;
            left: 40px;
            right: 40px;
            pointer-events: none;
            z-index: 9999;
        }

        .tv-banner {
            display: none;
            background: rgba(12, 10, 24, 0.95);
            border-left: 10px solid #ec4899;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 25px rgba(236, 72, 153, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            max-height: 280px; /* Permite más altura para soportar el texto agrandado */
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tv-banner.fade-out {
            animation: slideOut 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        .tv-header {
            background: linear-gradient(90deg, #ec4899 0%, #8b5cf6 100%);
            padding: 10px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tv-badge {
            color: #fff;
            font-size: 18px; /* Agrandado para OBS */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tv-badge-dot {
            width: 12px;
            height: 12px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
        }

        .tv-station {
            color: rgba(255, 255, 255, 0.95);
            font-size: 16px; /* Agrandado para OBS */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-body {
            padding: 22px 32px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tv-author-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
        }

        .tv-nombre {
            color: #ffffff;
            font-size: 38px; /* Agrandado para destacar el nombre al aire */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
            white-space: nowrap;
        }

        .tv-lugar {
            color: #f472b6;
            font-size: 24px; /* Agrandado para la ubicación */
            font-weight: 700;
            white-space: nowrap;
        }

        /* Mensaje de texto principal en tamaño Broadcast */
        .tv-mensaje {
            color: #ffffff;
            font-size: 30px; /* Tamaño impactante y legible en transmisiones */
            font-weight: 600;
            line-height: 1.35;
            font-style: italic;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Soporta hasta 3 líneas sin cortar texto */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-60px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(60px); }
        }
    </style>
</head>
<body>

    <div id="obsOverlay">
        <div id="tvBanner" class="tv-banner">
            <div class="tv-header">
                <div class="tv-badge">
                    <span class="tv-badge-dot"></span>
                    MENSAJE AL AIRE
                </div>
                <div class="tv-station">DJ TV Estación Mix</div>
            </div>
            <div class="tv-body">
                <div class="tv-author-row">
                    <span class="tv-nombre" id="obsNombre">—</span>
                    <span class="tv-lugar" id="obsLugar"></span>
                </div>
                <div class="tv-mensaje" id="obsMensaje">—</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyARhC07Q4CvEqB1JytYK_AkY2_HQw4ToSY",
          authDomain: "dj-tv-estacion-mix.firebaseapp.com",
          projectId: "dj-tv-estacion-mix",
          storageBucket: "dj-tv-estacion-mix.firebasestorage.app",
          messagingSenderId: "955348774578",
          appId: "1:955348774578:web:221c8f8edac25a53e023ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // TIEMPOS EN MILISEGUNDOS
        const DISPLAY_TIME = 30000; // 30 segundos visible al aire
        const PAUSE_TIME = 30000;   // 30 segundos de pausa entre saludos
        const EXPIRATION_MS = 24 * 60 * 60 * 1000; // 24 horas

        const tvBanner = document.getElementById('tvBanner');
        const obsNombre = document.getElementById('obsNombre');
        const obsLugar = document.getElementById('obsLugar');
        const obsMensaje = document.getElementById('obsMensaje');

        let messageList = [];
        let currentIndex = 0;
        let isLoopRunning = false;

        const q = query(
            collection(db, "mensajes"),
            where("estado", "==", "aprobado"),
            orderBy("timestamp", "desc")
        );

        // Escuchar cambios en la base de datos en tiempo real
        onSnapshot(q, (snapshot) => {
            const rawList = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                data.id = doc.id;
                rawList.push(data);
            });

            // Filtrar solo los mensajes que tengan menos de 24 horas
            messageList = rawList.filter(isValidMessage);

            // Iniciar el bucle de reproducción si hay mensajes y no estaba corriendo
            if (messageList.length > 0 && !isLoopRunning) {
                currentIndex = 0;
                startLoop();
            }
        }, (error) => {
            console.error("Error cargando mensajes para OBS:", error);
        });

        // Verifica si el mensaje fue enviado dentro de las últimas 24 horas
        function isValidMessage(msg) {
            if (!msg.timestamp) return true;
            const msgTime = msg.timestamp.toDate ? msg.timestamp.toDate().getTime() : Date.now();
            return (Date.now() - msgTime) <= EXPIRATION_MS;
        }

        function startLoop() {
            // Filtrar nuevamente para descartar vencidos en cada ciclo
            messageList = messageList.filter(isValidMessage);

            if (messageList.length === 0) {
                isLoopRunning = false;
                tvBanner.style.display = 'none';
                return;
            }

            isLoopRunning = true;

            // Reiniciar índice si excedió el tamaño actual de la lista
            if (currentIndex >= messageList.length) {
                currentIndex = 0;
            }

            const msg = messageList[currentIndex];

            // Cargar datos en el zócalo
            obsNombre.textContent = msg.nombre || 'ANÓNIMO';
            obsLugar.textContent = msg.lugar ? `📍 ${msg.lugar}` : '';
            obsMensaje.textContent = `"${msg.msj || ''}"`;

            // Mostrar zócalo
            tvBanner.classList.remove('fade-out');
            tvBanner.style.display = 'block';

            // Mantiene el saludo visible 30 segundos
            setTimeout(() => {
                tvBanner.classList.add('fade-out');

                // Ocultar e iniciar los 30 segundos de pausa
                setTimeout(() => {
                    tvBanner.style.display = 'none';

                    // Avanzar al siguiente mensaje para la próxima vuelta (bucle)
                    currentIndex = (currentIndex + 1) % messageList.length;

                    // Espera 30 segundos limpia la pantalla antes del próximo saludo
                    setTimeout(() => {
                        startLoop();
                    }, PAUSE_TIME);

                }, 500); // Duración de animación de salida

            }, DISPLAY_TIME);
        }
    </script>
</body>
</html>
