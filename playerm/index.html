<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor en Vivo</title>
    
    <!-- Estilos modernos de Plyr -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* Reset y fondo oscuro cinematográfico */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Contenedor del player */
        .player-container {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            position: relative;
        }

        /* Forzar al player a ocupar todo el espacio */
        .plyr {
            height: 100%;
            width: 100%;
        }
        
        .plyr__video-wrapper {
            height: 100%;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ajusta el video sin recortarlo. Usa 'cover' si prefieres que llene todo */
        }

        /* Overlay "Quitar Silencio" con efecto Glassmorphism */
        #unmute-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.4s ease, transform 0.2s ease;
            user-select: none;
        }

        #unmute-overlay:hover {
            background: rgba(229, 9, 20, 0.9); /* Rojo Rumble al pasar el mouse */
            transform: translate(-50%, -50%) scale(1.05);
        }

        #unmute-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Icono de volumen en el overlay */
        .icon-sound {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Personalización extra de Plyr para que sea ultra-minimalista */
        .plyr--full-ui.plyr--video .plyr__control--overlaid {
            background: rgba(229, 9, 20, 0.9);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="player" playsinline autoplay muted>
            <!-- El source se inyecta vía JavaScript con HLS -->
        </video>
        
        <!-- Overlay para quitar el silencio -->
        <div id="unmute-overlay">
            <svg class="icon-sound" viewBox="0 0 24 24">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
            Toca para quitar silencio
        </div>
    </div>

    <!-- Librerías: HLS.js (para el stream) y Plyr (para la UI moderna) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const overlay = document.getElementById('unmute-overlay');
            const videoId = "7flnyw";
            
            // URLs de Rumble (Primero intenta LIVE, si falla, usa VOD)
            const liveUrl = `https://rumble.com/live-hls/${videoId}/playlist.m3u8`;
            const vodUrl = `https://rumble.com/hls-vod/${videoId}/playlist.m3u8`;

            let player;
            let hls;

            // Función para inicializar el reproductor con una URL dada
            function initPlayer(sourceUrl) {
                if (Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        startLevel: -1 // Auto calidad al inicio
                    });
                    
                    hls.loadSource(sourceUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                        // Extraer calidades disponibles del stream
                        const availableQualities = hls.levels.map((l) => l.height);
                        availableQualities.unshift(0); // 0 = Automático

                        // Configurar Plyr con las calidades detectadas
                        const plyrOptions = {
                            autoplay: true,
                            muted: true,
                            controls: [
                                'play-large', 'play', 'progress', 'current-time', 
                                'mute', 'volume', 'settings', 'pip', 'fullscreen'
                            ],
                            settings: ['quality', 'speed'],
                            quality: {
                                default: 0,
                                options: availableQualities,
                                forced: true,
                                onChange: (newQuality) => updateQuality(newQuality)
                            },
                            i18n: {
                                speed: 'Velocidad',
                                quality: 'Calidad',
                                pip: 'Imagen a imagen',
                                enterFullscreen: 'Pantalla completa',
                                exitFullscreen: 'Salir de pantalla completa',
                                mute: 'Silenciar',
                                unmute: 'Activar sonido'
                            }
                        };

                        player = new Plyr(video, plyrOptions);
                        
                        // Intentar reproducir (los navegadores requieren interacción para sonido)
                        video.play().catch(() => {
                            // Si el autoplay falla, el overlay se encarga de iniciar
                        });
                    });

                    // Si la URL Live falla (ej. no hay emisión activa), cambiar a VOD
                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal && sourceUrl === liveUrl) {
                            console.log("Stream en vivo no disponible, cargando grabación...");
                            hls.destroy();
                            initPlayer(vodUrl);
                        }
                    });

                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Soporte nativo para Safari (iOS / macOS)
                    video.src = sourceUrl;
                    player = new Plyr(video, { autoplay: true, muted: true });
                }
            }

            // Cambiar calidad en HLS
            function updateQuality(newQuality) {
                if (newQuality === 0) {
                    hls.currentLevel = -1; // Automático
                } else {
                    hls.levels.forEach((level, levelIndex) => {
                        if (level.height === newQuality) {
                            hls.currentLevel = levelIndex;
                        }
                    });
                }
            }

            // --- LÓGICA DEL OVERLAY "QUITAR SILENCIO" ---
            
            // 1. Al hacer clic en el overlay, quitar silencio y ocultarlo
            overlay.addEventListener('click', () => {
                video.muted = false;
                video.volume = 1.0;
                if (player) {
                    player.volume = 1.0;
                    player.muted = false;
                }
                overlay.classList.add('hidden');
                video.play();
            });

            // 2. También ocultar el overlay si el usuario usa los controles de volumen de Plyr
            video.addEventListener('volumechange', () => {
                if (!video.muted && video.volume > 0) {
                    overlay.classList.add('hidden');
                }
            });

            // 3. Si el usuario hace clic directamente en el video, también quitar silencio
            video.addEventListener('click', () => {
                if (video.muted) {
                    video.muted = false;
                    if (player) player.muted = false;
                    overlay.classList.add('hidden');
                }
            });

            // Iniciar el proceso
            initPlayer(liveUrl);
        });
    </script>
</body>
</html>
