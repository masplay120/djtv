<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Mix - En Vivo</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .player-container { width: 100%; height: 100%; position: relative; }
        .plyr { height: 100%; width: 100%; }
        .plyr__video-wrapper { height: 100%; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        #unmute-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(8px);
            color: #fff; padding: 16px 32px; border-radius: 50px; font-size: 1.1rem;
            font-weight: 600; cursor: pointer; z-index: 50; display: flex;
            align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.4s ease, transform 0.2s ease; user-select: none;
        }
        #unmute-overlay:hover { background: rgba(229, 9, 20, 0.9); transform: translate(-50%, -50%) scale(1.05); }
        #unmute-overlay.hidden { opacity: 0; pointer-events: none; }
        .icon-sound { width: 24px; height: 24px; fill: currentColor; }
        #status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-family: sans-serif; z-index: 10; text-align: center; }
    </style>
</head>
<body>
    <div class="player-container">
        <div id="status-msg">🔄 Conectando con Estación Mix...</div>
        <video id="player" playsinline autoplay muted></video>
        <div id="unmute-overlay" class="hidden">
            <svg class="icon-sound" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            Toca para quitar silencio
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const video = document.getElementById('player');
            const overlay = document.getElementById('unmute-overlay');
            const statusMsg = document.getElementById('status-msg');
            let player, hls;

            try {
                // ✅ LLAMAMOS A NUESTRA FUNCIÓN SERVERLESS (No a Rumble directamente)
                const response = await fetch('/api/get-stream');
                if (!response.ok) throw new Error(`Error del servidor: ${response.status}`);
                
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                statusMsg.style.display = 'none';

                // Construir URL con el ID seguro recibido del servidor
                const streamUrl = data.is_live 
                    ? `https://rumble.com/live-hls/${data.id}/playlist.m3u8`
                    : `https://rumble.com/hls-vod/${data.id}/playlist.m3u8`;

                // Iniciar reproductor (misma lógica probada anteriormente)
                if (Hls.isSupported()) {
                    hls = new Hls({ enableWorker: true, lowLatencyMode: true, startLevel: -1 });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        const qualities = hls.levels.map(l => l.height);
                        qualities.unshift(0);

                        player = new Plyr(video, {
                            autoplay: true, muted: true,
                            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
                            settings: ['quality', 'speed'],
                            quality: {
                                default: 0, options: qualities, forced: true,
                                onChange: (q) => { hls.currentLevel = (q === 0) ? -1 : hls.levels.findIndex(l => l.height === q); }
                            },
                            i18n: { speed: 'Velocidad', quality: 'Calidad', pip: 'Imagen a imagen', mute: 'Silenciar', unmute: 'Activar sonido' }
                        });
                        video.play().catch(() => overlay.classList.remove('hidden'));
                    });

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal && data.is_live) {
                            hls.destroy();
                            hls = new Hls({ enableWorker: true });
                            hls.loadSource(`https://rumble.com/hls-vod/${data.id}/playlist.m3u8`);
                            hls.attachMedia(video);
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                    player = new Plyr(video, { autoplay: true, muted: true });
                    video.play().catch(() => overlay.classList.remove('hidden'));
                }

            } catch (error) {
                statusMsg.innerHTML = `⚠️ ${error.message}<br><small>Contacta al administrador.</small>`;
            }

            // Lógica del Overlay
            const unmute = () => {
                video.muted = false; video.volume = 1.0;
                if (player) { player.volume = 1.0; player.muted = false; }
                overlay.classList.add('hidden');
                video.play();
            };
            overlay.addEventListener('click', unmute);
            video.addEventListener('click', () => { if (video.muted) unmute(); });
            video.addEventListener('volumechange', () => { if (!video.muted && video.volume > 0) overlay.classList.add('hidden'); });
        });
    </script>
</body>
</html>
