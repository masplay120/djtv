<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Profesional HLS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: default;
        }

        /* Ocultar cursor cuando los controles están ocultos */
        .video-container.controls-hidden {
            cursor: none;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .spinner {
            width: 56px;
            height: 56px;
            position: relative;
        }

        .spinner::before,
        .spinner::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .spinner::before {
            width: 100%;
            height: 100%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                #3ea6ff 90deg,
                transparent 180deg
            );
            animation: rotate 1.5s linear infinite;
        }

        .spinner::after {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            background: #1a1a1a;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #e5e5e5;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            animation: pulse-text 2s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .progress-bar {
            width: 180px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #3ea6ff, transparent);
            animation: loading-slide 1.5s ease-in-out infinite;
        }

        @keyframes loading-slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 50px 16px 14px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            transform: translateY(10px);
        }

        /* Mostrar controles en hover o cuando está pausado */
        .video-container:hover .controls-overlay,
        .video-container.is-paused .controls-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        /* ✅ NUEVO: Ocultar controles cuando están en modo hidden (prioridad máxima) */
        .video-container.controls-hidden .controls-overlay {
            opacity: 0 !important;
            transform: translateY(20px) !important;
            pointer-events: none;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            cursor: pointer;
            padding: 7px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            min-width: 38px;
            height: 38px;
            flex-shrink: 0;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .control-btn:active { transform: scale(0.95); }
        .control-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .time-display {
            color: #e5e5e5;
            font-size: 12px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            padding: 0 6px;
            white-space: nowrap;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
        }

        .volume-slider-wrapper {
            width: 0;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin 0.3s ease;
            display: flex;
            align-items: center;
            margin-left: 0;
        }

        .volume-control:hover .volume-slider-wrapper {
            width: 80px;
            margin-left: 6px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.25);
            outline: none;
            cursor: pointer;
            position: relative;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.15s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .settings-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.2s ease;
            height: 38px;
            flex-shrink: 0;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }

        .settings-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        .quality-indicator {
            background: rgba(0,0,0,0.6);
            color: #3ea6ff;
            padding: 2px 7px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(62, 166, 255, 0.3);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .quality-indicator.is-auto {
            color: #fff;
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.2);
        }

        .quality-indicator.is-audio {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.1);
        }

        .quality-menu {
            position: absolute;
            bottom: 60px;
            right: 16px;
            background: rgba(28, 28, 28, 0.95);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 180px;
            max-width: 90vw;
            display: none;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 20;
        }

        .quality-menu.show {
            display: flex;
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .quality-option {
            background: transparent;
            border: none;
            color: #e5e5e5;
            padding: 11px 18px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quality-option:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .quality-option.active { color: #3ea6ff; font-weight: 600; }
        .quality-option.active::after { content: "✓"; font-size: 15px; font-weight: bold; }

        .audio-only-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #2a2a2a 0%, #0f0f0f 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .audio-only-overlay.show { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .audio-icon {
            font-size: 64px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(74, 222, 128, 0.4));
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .audio-text { font-size: 20px; font-weight: 700; color: #f1f1f1; letter-spacing: -0.5px; }
        .audio-subtext { font-size: 13px; color: #a0a0a0; margin-top: 8px; font-weight: 400; }

        .unmute-prompt {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
        }

        .unmute-prompt.visible {
            opacity: 1;
            pointer-events: auto;
            animation: fadeIn 0.5s ease;
        }

        .unmute-prompt:hover {
            background: rgba(40, 40, 40, 0.95);
            transform: translate(-50%, -50%) scale(1.05);
            border-color: rgba(255,255,255,0.3);
        }

        .unmute-prompt svg { width: 20px; height: 20px; fill: #ff4444; flex-shrink: 0; }

        @media (max-width: 640px) {
            body { padding: 8px; }
            
            .controls-overlay { padding: 40px 10px 10px; }
            .controls-left, .controls-right { gap: 5px; }
            
            .control-btn { min-width: 34px; height: 34px; padding: 6px; }
            .control-btn svg { width: 16px; height: 16px; }
            
            .settings-btn { padding: 6px 10px; font-size: 11px; height: 34px; gap: 4px; }
            .settings-btn svg { width: 14px; height: 14px; }
            
            .quality-indicator { font-size: 10px; padding: 2px 5px; }
            
            .time-display { font-size: 11px; padding: 0 3px; }
            
            .volume-control:hover .volume-slider-wrapper { width: 60px; }
            .volume-slider { width: 60px; }
            
            .audio-icon { font-size: 48px; }
            .audio-text { font-size: 16px; }
            .audio-subtext { font-size: 12px; }
            
            .unmute-prompt { padding: 10px 18px; font-size: 12px; gap: 8px; }
            .unmute-prompt svg { width: 16px; height: 16px; }
            
            .spinner { width: 44px; height: 44px; }
            .loading-text { font-size: 13px; }
            .progress-bar { width: 140px; }
        }

        @media (max-width: 380px) {
            .time-display { display: none; }
            .volume-slider-wrapper { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loader-container">
                <div class="spinner"></div>
                <div class="loading-text">Cargando señal...</div>
                <div class="progress-bar"></div>
            </div>
        </div>

        <video id="video" autoplay muted playsinline></video>
        
        <div class="unmute-prompt" id="unmutePrompt">
            <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <span>Click para activar sonido</span>
        </div>

        <div class="audio-only-overlay" id="audioOverlay">
            <div class="audio-icon">🎵</div>
            <div class="audio-text">Modo Solo Audio</div>
            <div class="audio-subtext">Reproduciendo solo la pista de audio para ahorrar datos</div>
        </div>

        <div class="controls-overlay">
            <div class="controls-left">
                <button class="control-btn" id="playPauseBtn" title="Reproducir/Pausar">
                    <svg id="iconPlay" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="iconPause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <div class="volume-control">
                    <button class="control-btn" id="muteBtn" title="Activar/Desactivar sonido">
                        <svg id="iconMute" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                        <svg id="iconVolumeLow" viewBox="0 0 24 24" style="display:none;"><path d="M7 9v6h4l5 5V4l-5 5H7z"/></svg>
                        <svg id="iconVolumeHigh" viewBox="0 0 24 24" style="display:none;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                    <div class="volume-slider-wrapper">
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">
                    </div>
                </div>
                
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            </div>
            
            <div class="controls-right">
                <button class="settings-btn" id="settingsBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    <span id="currentQualityBadge" class="quality-indicator is-auto">Auto</span>
                </button>

                <button class="control-btn" id="pipBtn" title="Imagen en Imagen">
                    <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
                </button>

                <button class="control-btn" id="fullscreenBtn" title="Pantalla Completa">
                    <svg id="iconFullscreen" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    <svg id="iconExitFullscreen" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
            </div>
        </div>

        <div class="quality-menu" id="qualityMenu"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const videoSrc = 'https://pruebas.fachacarlos1.workers.dev/playlist.m3u8';
        const videoContainer = document.getElementById('videoContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const qualityMenu = document.getElementById('qualityMenu');
        const settingsBtn = document.getElementById('settingsBtn');
        const audioOverlay = document.getElementById('audioOverlay');
        const unmutePrompt = document.getElementById('unmutePrompt');
        const currentQualityBadge = document.getElementById('currentQualityBadge');
        
        const playPauseBtn = document.getElementById('playPauseBtn');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const muteBtn = document.getElementById('muteBtn');
        const iconMute = document.getElementById('iconMute');
        const iconVolumeLow = document.getElementById('iconVolumeLow');
        const iconVolumeHigh = document.getElementById('iconVolumeHigh');
        const volumeSlider = document.getElementById('volumeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const pipBtn = document.getElementById('pipBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const iconFullscreen = document.getElementById('iconFullscreen');
        const iconExitFullscreen = document.getElementById('iconExitFullscreen');

        let hls = null;
        let savedVolume = 1;
        let hideControlsTimer = null;

        if (!document.pictureInPictureEnabled || video.disablePictureInPicture) {
            pipBtn.style.display = 'none';
        }

        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';

        function hideLoader() {
            loadingOverlay.classList.add('hidden');
        }

        if (Hls.isSupported()) {
            hls = new Hls({
                startLevel: -1,
                capLevelToPlayerSize: true,
                maxMaxBufferLength: 30,
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                setupQualityMenu(hls, data.levels);
                updateQualityBadgeDisplay(-1);
            });

            hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
                updateQualityBadgeDisplay(data.level);
            });

            video.addEventListener('canplay', hideLoader);
            video.addEventListener('playing', hideLoader);

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => {
                qualityMenu.innerHTML = '<div class="quality-option active">Auto (Nativo)</div>';
                currentQualityBadge.textContent = "Auto";
            });
            video.addEventListener('canplay', hideLoader);
            video.addEventListener('playing', hideLoader);
        }

        setTimeout(hideLoader, 5000);

        // ✅ Sistema de auto-ocultar controles (funciona en pantalla chica Y completa)
        function resetHideControlsTimer() {
            // Mostrar controles
            videoContainer.classList.remove('controls-hidden');
            
            // Limpiar timer anterior
            if (hideControlsTimer) {
                clearTimeout(hideControlsTimer);
            }
            
            // Si el video está reproduciéndose, ocultar controles después de 3s
            if (!video.paused) {
                hideControlsTimer = setTimeout(() => {
                    videoContainer.classList.add('controls-hidden');
                }, 3000);
            }
        }

        // Escuchar movimiento del mouse, clicks y touch
        videoContainer.addEventListener('mousemove', resetHideControlsTimer);
        videoContainer.addEventListener('mousedown', resetHideControlsTimer);
        videoContainer.addEventListener('touchstart', resetHideControlsTimer);

        // Cuando el video se pausa, siempre mostrar controles
        video.addEventListener('pause', () => {
            videoContainer.classList.remove('controls-hidden');
            if (hideControlsTimer) {
                clearTimeout(hideControlsTimer);
            }
        });

        // Cuando el video se reproduce, iniciar timer
        video.addEventListener('play', () => {
            resetHideControlsTimer();
        });

        function updateQualityBadgeDisplay(levelIndex) {
            const activeLevel = hls.currentLevel !== -1 ? hls.currentLevel : levelIndex;
            
            if (activeLevel === -1 || activeLevel === undefined) {
                setBadgeText("Auto", "is-auto");
                return;
            }

            const level = hls.levels[activeLevel];
            if (!level) return;

            if (level.height) {
                setBadgeText(level.height + "p", "");
            } else {
                setBadgeText("Audio", "is-audio");
            }
        }

        function setBadgeText(text, className) {
            currentQualityBadge.textContent = text;
            currentQualityBadge.className = "quality-indicator " + className;
        }

        function setupQualityMenu(hlsInstance, levels) {
            qualityMenu.innerHTML = '';
            
            const autoBtn = document.createElement('button');
            autoBtn.className = 'quality-option active';
            autoBtn.innerHTML = '<span>Auto (Recomendado)</span>';
            autoBtn.onclick = () => {
                hlsInstance.currentLevel = -1;
                updateActiveButton(autoBtn);
                exitAudioOnlyMode();
                setBadgeText("Auto", "is-auto");
            };
            qualityMenu.appendChild(autoBtn);

            levels.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.className = 'quality-option';
                
                if (level.height) {
                    btn.innerHTML = `<span>${level.height}p</span>`;
                    btn.onclick = () => {
                        hlsInstance.currentLevel = index;
                        updateActiveButton(btn);
                        exitAudioOnlyMode();
                        setBadgeText(level.height + "p", "");
                    };
                } else {
                    btn.innerHTML = '<span>🎵 Solo Audio</span>';
                    btn.onclick = () => {
                        hlsInstance.currentLevel = index;
                        updateActiveButton(btn);
                        enterAudioOnlyMode();
                        setBadgeText("Audio", "is-audio");
                    };
                }
                qualityMenu.appendChild(btn);
            });
        }

        function updateActiveButton(activeBtn) {
            document.querySelectorAll('.quality-option').forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
            qualityMenu.classList.remove('show');
        }

        function enterAudioOnlyMode() {
            audioOverlay.classList.add('show');
            video.muted = false;
            updateVolumeIcon();
            unmutePrompt.classList.remove('visible');
        }

        function exitAudioOnlyMode() {
            audioOverlay.classList.remove('show');
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        video.addEventListener('play', () => {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
            videoContainer.classList.remove('is-paused');
        });

        video.addEventListener('pause', () => {
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            videoContainer.classList.add('is-paused');
        });

        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', (e) => {
            if (e.target === video) togglePlay();
        });

        function toggleMute() {
            if (video.muted || video.volume === 0) {
                video.muted = false;
                video.volume = savedVolume > 0 ? savedVolume : 0.5;
                volumeSlider.value = video.volume * 100;
            } else {
                savedVolume = video.volume;
                video.muted = true;
                volumeSlider.value = 0;
            }
            updateVolumeIcon();
            if (!video.muted) unmutePrompt.classList.remove('visible');
        }

        function updateVolumeIcon() {
            const isMuted = video.muted || video.volume === 0;
            const volume = isMuted ? 0 : video.volume;
            
            iconMute.style.display = isMuted ? 'block' : 'none';
            iconVolumeLow.style.display = (!isMuted && volume < 0.5) ? 'block' : 'none';
            iconVolumeHigh.style.display = (!isMuted && volume >= 0.5) ? 'block' : 'none';
        }

        muteBtn.addEventListener('click', toggleMute);

        volumeSlider.addEventListener('input', (e) => {
            const value = e.target.value / 100;
            video.volume = value;
            video.muted = (value === 0);
            if (value > 0) savedVolume = value;
            updateVolumeIcon();
            if (value > 0) unmutePrompt.classList.remove('visible');
        });

        video.addEventListener('volumechange', () => {
            if (!video.muted) {
                volumeSlider.value = video.volume * 100;
            } else {
                volumeSlider.value = 0;
            }
            updateVolumeIcon();
        });

        updateVolumeIcon();

        unmutePrompt.addEventListener('click', () => {
            video.muted = false;
            video.volume = savedVolume > 0 ? savedVolume : 1;
            volumeSlider.value = video.volume * 100;
            updateVolumeIcon();
            unmutePrompt.classList.remove('visible');
        });

        setTimeout(() => {
            if (video.muted && !video.paused) unmutePrompt.classList.add('visible');
        }, 1500);

        video.addEventListener('play', () => {
            if (video.muted) {
                setTimeout(() => { if(video.muted) unmutePrompt.classList.add('visible'); }, 1000);
            }
        });

        pipBtn.addEventListener('click', async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await video.requestPictureInPicture();
                }
            } catch (err) {
                console.warn('PiP no disponible:', err);
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement) {
                if (videoContainer.requestFullscreen) {
                    videoContainer.requestFullscreen();
                } else if (videoContainer.webkitRequestFullscreen) {
                    videoContainer.webkitRequestFullscreen();
                } else if (videoContainer.mozRequestFullScreen) {
                    videoContainer.mozRequestFullScreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        function onFullscreenChange() {
            const isFullscreen = !!(document.fullscreenElement || 
                                    document.webkitFullscreenElement || 
                                    document.mozFullScreenElement);
            iconFullscreen.style.display = isFullscreen ? 'none' : 'block';
            iconExitFullscreen.style.display = isFullscreen ? 'block' : 'none';
            fullscreenBtn.title = isFullscreen ? 'Salir de Pantalla Completa' : 'Pantalla Completa';
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('mozfullscreenchange', onFullscreenChange);

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        video.addEventListener('timeupdate', () => {
            timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration || 0)}`;
        });

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!qualityMenu.contains(e.target) && !settingsBtn.contains(e.target)) {
                qualityMenu.classList.remove('show');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.key.toLowerCase()) {
                case ' ':
                case 'k':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'm':
                    toggleMute();
                    break;
                case 'f':
                    toggleFullscreen();
                    break;
                case 'i':
                    pipBtn.click();
                    break;
                case 'arrowup':
                    e.preventDefault();
                    video.volume = Math.min(1, video.volume + 0.1);
                    video.muted = false;
                    break;
                case 'arrowdown':
                    e.preventDefault();
                    video.volume = Math.max(0, video.volume - 0.1);
                    break;
            }
        });
    </script>
</body>
</html>
